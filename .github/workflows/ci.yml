name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  platform-tests:
    name: Test (${{ matrix.os }}, Python 3.11–3.13)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Test supported Python versions
        shell: bash
        run: |
          set -euo pipefail
          for python in 3.11 3.12 3.13; do
            echo "::group::Python $python"
            uv sync --group dev --python "$python"
            uv run --python "$python" pytest tests -q
            echo "::endgroup::"
          done

  pytest:
    name: Basic pytest suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install test dependencies
        run: uv sync --group dev
      - name: Run pytest
        run: uv run pytest tests -q

  install-from-git:
    name: Install from git URL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install this commit as a consumer would
        # Proves the documented install path works against the actual ref,
        # including that package data lands inside site-packages.
        run: |
          uv venv consumer
          uv pip install --python consumer/bin/python \
            "spiritus @ git+${{ github.server_url }}/${{ github.repository }}@${{ github.sha }}"
      - name: Smoke-test the installed package
        # Must run from outside the checkout. With the repo as cwd, `import
        # spiritus` resolves to ./spiritus/ (the source tree) rather than the
        # installed package, and this job would verify nothing.
        working-directory: /tmp
        run: |
          "$GITHUB_WORKSPACE/consumer/bin/python" - <<'PY'
          import inspect
          from pathlib import Path
          import spiritus
          from spiritus import run, AppConfig, WorkspaceFolder
          from spiritus.runtime.paths import resource_path

          pkg = Path(inspect.getfile(spiritus)).parent
          assert "site-packages" in str(pkg), pkg
          ui = resource_path("ui")
          assert ui.is_dir() and (ui / "index.html").exists(), ui

          cfg = AppConfig(
              app_id="ci-smoke", app_title="CI Smoke", app_root=Path.cwd(),
              workspace_folders=(WorkspaceFolder("inbox", "inbox", "Inbox"),),
          )
          assert cfg.folder_names() == ["inbox"]
          assert callable(run)
          print("installed from git:", spiritus.__version__, "at", pkg)
          PY
      - name: The engine CLI must work from a bare install
        # Resolution and reporting only — install-engine would pull ~60 MB.
        # A missing engine must exit non-zero with the fix in the message.
        # Outside the checkout, for the same shadowing reason as above.
        working-directory: /tmp
        run: |
          SPIRITUS="$GITHUB_WORKSPACE/consumer/bin/spiritus"
          "$SPIRITUS" --version
          "$SPIRITUS" engine-info || true
          if "$SPIRITUS" engine-path; then
            echo "::error::engine-path succeeded on a runner with no engine"
            exit 1
          fi
          "$SPIRITUS" engine-path 2>&1 | grep -q "install-engine"
          echo "engine CLI reports a missing engine correctly"
