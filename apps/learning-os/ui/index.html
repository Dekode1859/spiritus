<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lexicon.ai</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="side-brand" class="side-brand"></div>
      <button class="btn btn-primary btn-block" id="btn-sidebar-import">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        Import
      </button>
      <nav id="side-nav" class="side-nav"></nav>
      <div class="side-footer">
        <div class="model-chip" id="model-chip"></div>
        <div class="engine-status" id="engine-status"><span class="status-dot"></span>Connecting…</div>
      </div>
    </aside>

    <main id="main">
      <div id="view"></div>
    </main>
  </div>

  <!-- Import modal -->
  <div id="import-modal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="import-modal-title">
      <div class="modal-head">
        <h2 id="import-modal-title">Import sources</h2>
        <button class="btn btn-icon btn-ghost" id="btn-import-close" aria-label="Close">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <button class="dropzone" id="import-dropzone">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>
        <span class="dropzone-title">Drop files here, or click to browse</span>
        <span class="dropzone-sub">Originals are preserved in <code>raw/</code> and converted to markdown in <code>processed/</code></span>
      </button>
      <div class="modal-divider"><span>or capture from the web</span></div>
      <div class="url-capture">
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <input id="import-url-input" class="input" type="url" placeholder="https://example.com/article" />
        </div>
        <button class="btn btn-primary" id="btn-import-url-go">Capture</button>
      </div>
      <div class="import-status" id="import-modal-status"></div>
      <div class="import-formats" id="import-formats"></div>
    </div>
  </div>

  <!-- Global drag & drop overlay -->
  <div id="drop-overlay" hidden>
    <div class="drop-overlay-inner">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>
      <span>Drop to import into your library</span>
    </div>
  </div>

  <div id="toast-stack"></div>
  <input id="file-input" type="file" multiple hidden />

  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
