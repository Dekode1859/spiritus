[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Spiritus is both the distribution name and the import package name.
name = "spiritus"
version = "0.0.36"
description = "An SDK and runtime for building agent-powered desktop applications"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Dekode1859", email = "prateekdwivedi30@gmail.com" }]
keywords = ["agents", "runtime", "desktop", "llm", "opencode", "pywebview"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "jsonschema>=4.23.0",
    "pywebview>=4.4.0",
    "requests>=2.31.0",
]

[project.scripts]
# Provisioning only — the CLI installs and reports the execution engine. It
# does not launch an application implicitly.
spiritus = "spiritus.__main__:main"

[project.urls]
Homepage = "https://github.com/Dekode1859/Spiritus"
Repository = "https://github.com/Dekode1859/Spiritus"
Issues = "https://github.com/Dekode1859/Spiritus/issues"
Changelog = "https://github.com/Dekode1859/Spiritus/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.optional-dependencies]
bundle = ["pyinstaller>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["spiritus"]

[tool.hatch.build.targets.sdist]
include = ["spiritus", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

# ui/ (app.js, index.html, style.css) and the module READMEs ship as package
# data — runtime/paths.py resolves them relative to the package dir, so they
# must land inside the installed package, not beside it.
[tool.hatch.build]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/.DS_Store",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -q"
markers = [
    "engine: requires the pinned local OpenCode binary but makes no model call",
    "live_opencode: makes a real model call through the pinned OpenCode engine",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # long lines: prose docstrings and embedded JS payloads
    "B008",  # function call in default arg — not a pattern used here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
